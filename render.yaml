services:
  - type: web
    name: worship-suno-agents
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: MAX_AUDIT_ITERATIONS
        value: "3"
      - key: MIN_PASSING_SCORE
        value: "8.5"
